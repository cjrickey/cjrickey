services:
  - type: web
    name: schedule-narrative-api
    runtime: python
    plan: starter
    rootDir: schedule_narrative
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    # Render polls this and won't route traffic to (and will restart) an
    # instance that stops answering -- e.g. after an OOM. See GET /health.
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: schedule-narrative-db
          property: connectionString
      # Set the rest of these in the Render dashboard (Environment tab) --
      # they're secrets, so they're deliberately not committed here.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLERK_ISSUER
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID_MONTHLY
        sync: false
      - key: STRIPE_PRICE_ID_ANNUAL
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: TRIAL_NARRATIVE_LIMIT
        sync: false
      - key: MAX_NARRATIVES_PER_DAY
        sync: false

databases:
  - name: schedule-narrative-db
    plan: basic-256mb
